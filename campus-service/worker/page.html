<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17634d"><title>南京农业大学地图导航 · 小deepseek</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:#183e33;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;color:white;background:#17634d}button:disabled{opacity:.55;cursor:wait}button.secondary{background:#e6efe9;color:#17634d}header{background:white;border-bottom:1px solid #dde7df;padding:16px 26px;display:flex;align-items:center;gap:14px}header .mark{display:grid;place-items:center;width:42px;height:42px;background:#17634d;color:white;border-radius:14px;font-size:25px}h1{font-size:20px;letter-spacing:.04em;margin:0}header p{font-size:12px;margin:0;color:#6c8175}.badge{margin-left:auto;background:#edf5ee;border-radius:20px;padding:5px 12px;font-size:12px}main{display:grid;grid-template-columns:355px minmax(0,1fr);height:calc(100vh - 82px)}aside{overflow:auto;background:#fff;padding:23px;border-right:1px solid #dde7df}h2{font-size:16px;margin:0 0 12px}label{display:block;font-size:13px;margin:12px 0 4px;color:#537062}select,input{width:100%;border:1px solid #cdded2;border-radius:9px;padding:10px;background:#fbfdfb;color:#183e33}input:focus,select:focus{outline:2px solid #80ad96;outline-offset:1px}.actions{display:flex;gap:8px;margin-top:15px}.actions button:first-child{flex:1}.section{border-top:1px solid #e3ebe4;margin-top:24px;padding-top:20px}.hint{color:#6c8175;font-size:12px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chips button{padding:4px 8px;font-size:12px;color:#456955;background:#edf3ef}#status{font-size:13px;margin-top:16px;min-height:22px}#status.error{color:#ad433d}#result{margin-top:15px}.summary{font-size:24px;color:#17634d;line-height:1.35}.summary small{font-size:13px;color:#537062}ol{padding-left:20px;font-size:13px}#mapArea{position:relative;min-height:400px}#map{position:absolute;inset:0}#fallback{position:absolute;inset:0;background:#eaf1e9}#fallback svg{width:100%;height:100%}#mapNote{position:absolute;bottom:20px;left:20px;right:20px;background:#fffffff0;border:1px solid #dce8dd;border-radius:12px;padding:10px 14px;color:#537062;font-size:12px;z-index:8;pointer-events:none}#saved{display:grid;gap:7px}#saved button{text-align:left;font-size:12px;color:#17634d;background:#eff5f0;padding:8px 10px}a{color:#17634d}.empty{font-size:12px;color:#74867a}button:focus-visible{outline:3px solid #92bca1;outline-offset:2px}@media(max-width:800px){main{display:flex;flex-direction:column;height:auto}aside{order:2;border:0;padding:20px}#mapArea{order:1;height:49vh;min-height:300px}header{padding:12px 17px}h1{font-size:17px}.badge{display:none}}
</style></head><body>
<header><span class="mark" aria-hidden="true">叶</span><div><h1>南京农业大学地图导航</h1><p>小deepseek · 陪你找到下一站</p></div><span class="badge">高德地图 × DeepSeek</span></header>
<main><aside><h2>校园路线</h2><form id="routeForm"><label for="start">从哪里出发</label><select id="start" required></select><label for="end">想去哪里</label><select id="end" required></select><label for="mode">出行方式</label><select id="mode"><option value="walking">步行</option><option value="bicycling">骑行</option><option value="driving">驾车</option></select><div class="actions"><button type="submit">规划路线 →</button><button type="button" class="secondary" id="swap" aria-label="交换起终点">⇄</button></div></form>
<div class="section"><h2>说一句，就出发</h2><form id="nlpForm"><label for="instruction">描述你的路线</label><input id="instruction" maxlength="200" placeholder="例如：从信息管理学院走到图书馆" required><div class="chips"><button type="button" id="example">试试：从信息管理学院到农学院</button></div><button type="submit" style="width:100%">让 DeepSeek 帮我找路</button></form><p class="hint">无需登录。路线描述将交给 DeepSeek 解析，路线由高德规划。</p></div>
<div id="status" role="status">正在加载校园地点…</div><div id="result"></div>
<div class="section"><h2>我的路线</h2><p class="hint">仅保存在当前设备，不与其他人共享。</p><div id="saved"></div></div><p class="hint">校园点位来自 NJAU-Map 项目。<a href="https://github.com/nayoagan-ship-it/LittleDeepSeek" target="_blank" rel="noopener">桌宠开源项目 ↗</a></p></aside>
<section id="mapArea" aria-label="校园地图"><div id="fallback"></div><div id="map"></div><div id="mapNote">正在加载高德地图；下方点位示意可用于选择地点。</div></section></main>
<script>
const $=id=>document.getElementById(id);let points=[],map=null,line=null,current=null,loading=false;
const readSaved=()=>{try{return JSON.parse(localStorage.getItem('littledeepseek-routes-v1')||'[]').filter(x=>x&&x.start&&x.end).slice(0,8)}catch{return []}};
function status(text,error=false){$('status').textContent=text;$('status').className=error?'error':''}
function project(c){return [(c[0]-118.63)/.035*1000,800-(c[1]-32)/.025*800]}
function schematic(route){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 1000 800');svg.setAttribute('role','img');svg.setAttribute('aria-label','校园点位示意');const bg=document.createElementNS(ns,'rect');bg.setAttribute('width','1000');bg.setAttribute('height','800');bg.setAttribute('fill','#eaf1e9');svg.append(bg);if(route){const poly=document.createElementNS(ns,'polyline');poly.setAttribute('points',route.coordinates.map(project).map(c=>c.join(',')).join(' '));poly.setAttribute('fill','none');poly.setAttribute('stroke','#24836a');poly.setAttribute('stroke-width','5');svg.append(poly)}for(const p of points){const [x,y]=project(p.coordinates),g=document.createElementNS(ns,'g'),dot=document.createElementNS(ns,'circle'),t=document.createElementNS(ns,'text');dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.setAttribute('r','5');dot.setAttribute('fill','#347e62');t.setAttribute('x',x+9);t.setAttribute('y',y+4);t.setAttribute('font-size','12');t.setAttribute('fill','#42654d');t.textContent=p.name;g.append(dot,t);g.style.cursor='pointer';g.addEventListener('click',()=>{$('end').value=p.id;status('终点已选择：'+p.name)});svg.append(g)}$('fallback').replaceChildren(svg)}
function saved(){const box=$('saved');box.replaceChildren();const list=readSaved();if(!list.length){const p=document.createElement('p');p.className='empty';p.textContent='规划后的路线会出现在这里。';box.append(p)}for(const item of list){const b=document.createElement('button');b.textContent=item.start.name+' → '+item.end.name;b.onclick=()=>show(item,false);box.append(b)}}
function show(route,remember=true){current=route;$('start').value=route.start.id;$('end').value=route.end.id;$('mode').value=route.mode;const result=$('result');result.replaceChildren();const title=document.createElement('h2');title.textContent=route.start.name+' → '+route.end.name;const summary=document.createElement('div');summary.className='summary';summary.textContent=(route.distance/1000).toFixed(2)+' 公里 · 约 '+Math.max(1,Math.ceil(route.duration/60))+' 分钟';result.append(title,summary);const steps=document.createElement('ol');for(const step of route.steps){const li=document.createElement('li');li.textContent=step;steps.append(li)}result.append(steps);if(map){if(line)map.remove(line);line=new AMap.Polyline({path:route.coordinates,strokeColor:'#176c53',strokeWeight:7,lineJoin:'round'});map.add(line);map.setFitView([line],false,[55,55,55,55])}schematic(route);status('路线已找到，出发前请留意现场道路。');if(remember){try{const list=readSaved().filter(r=>r.start.id!==route.start.id||r.end.id!==route.end.id||r.mode!==route.mode);localStorage.setItem('littledeepseek-routes-v1',JSON.stringify([route,...list].slice(0,8)))}catch{}saved()}}
async function requestRoute(url,options){if(loading)return;loading=true;document.querySelectorAll('form button').forEach(b=>b.disabled=true);status('正在规划路线，请稍候…');try{const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw Error(data.error||'路线暂时不可用');show(data)}catch(e){status(e.message||'网络连接失败，请重试。',true)}finally{loading=false;document.querySelectorAll('form button').forEach(b=>b.disabled=false)}}
$('routeForm').onsubmit=e=>{e.preventDefault();requestRoute('/api/route?'+new URLSearchParams({start:$('start').value,end:$('end').value,type:$('mode').value}))};$('nlpForm').onsubmit=e=>{e.preventDefault();requestRoute('/api/nlp_route',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({instruction:$('instruction').value})})};$('swap').onclick=()=>{const a=$('start').value;$('start').value=$('end').value;$('end').value=a};$('example').onclick=()=>{$('instruction').value='从信息管理学院步行到农学院';$('instruction').focus()};
async function loadMap(){try{const config=await (await fetch('/api/config')).json();if(!config.key)throw Error();window._AMapSecurityConfig={serviceHost:location.origin+'/_AMapService'};await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://webapi.amap.com/maps?v=2.0&key='+encodeURIComponent(config.key);script.onload=resolve;script.onerror=reject;document.head.append(script)});map=new AMap.Map('map',{zoom:15,center:[118.642,32.012],viewMode:'2D'});const markers=points.map(p=>{const marker=new AMap.Marker({position:p.coordinates,title:p.name});marker.on('click',()=>{$('end').value=p.id;status('终点已选择：'+p.name)});return marker});map.add(markers);map.setFitView(markers);map.on('complete',()=>{$('fallback').style.display='none';$('mapNote').textContent='点击地点可选为终点 · 按住鼠标拖动地图 · 滚轮缩放'});setTimeout(()=>{if($('fallback').style.display!=='none')$('mapNote').textContent='高德底图尚未就绪，当前显示校园点位示意；仍可规划路线。'},12000)}catch{$('mapNote').textContent='高德底图暂时未加载，当前显示校园点位示意；仍可规划路线。'}}
(async()=>{try{const r=await fetch('/api/points');if(!r.ok)throw Error();points=await r.json();for(const id of ['start','end'])for(const p of points){const option=document.createElement('option');option.value=p.id;option.textContent=p.name;$(id).append(option)}$('end').selectedIndex=Math.min(1,points.length-1);schematic();saved();status('已载入 '+points.length+' 个校园地点。');await loadMap()}catch{status('校园地点加载失败，请刷新重试。',true)}})();
</script></body></html>
